<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nios II</title>
</head>
<body>
    <input type="text" id="msg" maxlength="100">
    <button onclick="sendStr()">Transmit</button>
    <p id="res"></p>
    <script>
    async function sendStr() {
        const str = document.getElementById('msg').value;
        const ip = prompt("IP:", "192.168.1.100");
        const res = await fetch(`http://${ip}/`, {
            method: 'POST',
            body: str
        });
        const text = await res.text();
        document.getElementById('res').innerText = text;
    }
    </script>
</body>
</html>
